[package]
name = "horologe"
version = "1.0.1"
authors = ["Michael Dippery <michael@monkey-robot.com>"]
description = "Earth has 4 corner simultaneous 4-day time cube within single rotation"
readme = "README.md"
documentation = "https://docs.rs/horologe"
repository = "https://github.com/mdippery/horologe"
#homepage
license = "MIT"
keywords = ["calendar", "date", "time", "timezone"]
categories = ["date-and-time"]
edition = "2024"
rust-version = "1.85.1"

[features]
age = []
relative-age = ["age", "dep:regex", "dep:relativetime"]
test-utils = []

[dependencies]
chrono = "0.4.42"
regex = { version = "1.12.2", optional = true }
relativetime = { version = "0.1.4", optional = true }

[package.metadata.docs.rs]
all-features = true
